models:
  - name: stg_customers
    description: One row per customer. Renamed and typed from raw.customers.
    columns:
      - name: customer_id
        description: Stripe customer id (cus_...).
        data_tests: [unique, not_null]
      - name: created_at
        description: Account creation time (UTC). Before the experiment start means a returning customer.
        data_tests: [not_null]
      - name: country
        description: Customer address country (ISO 3166-1 alpha-2).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [US, GB, CA, DE, FR, AU, JP, BR, MX]
      - name: card_brand
        description: Brand of the customer's default card.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [visa, mastercard, amex, discover]
      - name: card_funding
        description: Funding type of the customer's default card.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [credit, debit, prepaid]

  - name: stg_checkout_sessions
    description: One row per Stripe Checkout Session.
    columns:
      - name: checkout_session_id
        description: Stripe checkout session id (cs_...).
        data_tests: [unique, not_null]
      - name: customer_id
        description: Customer who opened the session.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: payment_intent_id
        description: PaymentIntent created with the session (pi_...); charges link through it.
        data_tests: [unique, not_null]
      - name: created_at
        description: Session creation time (UTC).
        data_tests: [not_null]
      - name: expires_at
        description: Session expiry time (24 hours after creation).
      - name: mode
        description: Checkout mode; always `payment` (one-time payments).
      - name: status
        description: complete if the payment was authorized, otherwise expired.
        data_tests:
          - accepted_values:
              arguments:
                values: [complete, expired]
      - name: payment_status
        description: paid if the charge was captured, otherwise unpaid.
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, unpaid]
      - name: amount_total_minor
        description: Cart total in the currency's minor unit (whole yen for JPY).
        data_tests: [not_null]
      - name: currency
        description: Lowercase ISO currency code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fx_rates')
                field: currency

  - name: stg_charges
    description: One row per Stripe Charge (payment attempt), with outcome and card details flattened.
    columns:
      - name: charge_id
        description: Stripe charge id (ch_...).
        data_tests: [unique, not_null]
      - name: payment_intent_id
        description: PaymentIntent of the session this charge paid for. At most one charge per session.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_checkout_sessions')
                field: payment_intent_id
      - name: customer_id
        description: Customer who was charged.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: created_at
        description: Charge creation time (UTC), shortly after the session opened.
        data_tests: [not_null]
      - name: amount_minor
        description: Amount attempted, in minor units.
      - name: amount_captured_minor
        description: Amount captured, in minor units (0 unless captured).
      - name: currency
        description: Lowercase ISO currency code.
      - name: status
        description: succeeded if authorized, failed otherwise.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [succeeded, failed]
      - name: is_authorized
        description: True when the issuer approved the charge (status = succeeded).
      - name: is_captured
        description: True when the authorization was captured. Captured charges are the successful payments.
      - name: outcome_type
        description: Stripe outcome.type.
        data_tests:
          - accepted_values:
              arguments:
                values: [authorized, issuer_declined, blocked]
      - name: outcome_reason
        description: Stripe outcome.reason for declines and blocks (null when authorized).
      - name: outcome_network_status
        description: Stripe outcome.network_status.
        data_tests:
          - accepted_values:
              arguments:
                values: [approved_by_network, declined_by_network, not_sent_to_network]
      - name: outcome_risk_level
        description: Stripe Radar risk level at charge time.
        data_tests:
          - accepted_values:
              arguments:
                values: [normal, elevated, highest]
      - name: failure_code
        description: Stripe failure_code for failed charges.
      - name: card_brand
        description: Card brand used for the charge.
      - name: card_country
        description: Card issuing country.
      - name: card_funding
        description: Card funding type.
      - name: cvc_check
        description: Result of the CVC check (pass, fail). Null when no CVC was sent (treatment) or Radar blocked the charge.
        data_tests:
          - accepted_values:
              arguments:
                values: [pass, fail]

  - name: stg_disputes
    description: One row per Stripe Dispute, as observed at the end of analysis_date.
    columns:
      - name: dispute_id
        description: Stripe dispute id (dp_...).
        data_tests: [unique, not_null]
      - name: charge_id
        description: Disputed charge. A charge has at most one dispute.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_charges')
                field: charge_id
      - name: created_at
        description: When the dispute was opened (UTC).
        data_tests: [not_null]
      - name: amount_minor
        description: Disputed amount in minor units (the full captured amount).
      - name: currency
        description: Lowercase ISO currency code.
      - name: reason
        description: Stripe dispute reason.
        data_tests:
          - accepted_values:
              arguments:
                values: [fraudulent, product_not_received, duplicate, credit_not_processed, product_unacceptable]
      - name: status
        description: Dispute status as of the snapshot.
        data_tests:
          - accepted_values:
              arguments:
                values: [needs_response, under_review, won, lost]

  - name: stg_assignments
    description: One row per (experiment, customer) bucketing decision.
    columns:
      - name: customer_id
        description: Assigned customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: experiment_id
        description: Experiment key.
        data_tests: [not_null]
      - name: variant
        description: control (CVC field shown) or treatment (CVC field removed).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [control, treatment]
      - name: assigned_at
        description: When the customer was bucketed (their first checkout in the experiment window).
        data_tests: [not_null]

  - name: stg_fx_rates
    description: Currency reference data used to convert minor units to USD.
    columns:
      - name: currency
        description: Lowercase ISO currency code.
        data_tests: [unique, not_null]
      - name: minor_unit_exponent
        description: Decimal places of the minor unit (2 for most currencies, 0 for JPY).
      - name: usd_per_unit
        description: Fixed USD value of one major unit of the currency.
