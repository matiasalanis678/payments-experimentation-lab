models:
  - name: dim_customers
    description: >
      One row per customer with observable, pre-treatment attributes and a rule-based risk score.
      Risk points: account age at first exposure under 30 days +2 (under 90 days +1), prepaid card +2,
      country BR or MX +1. Bands: 0 low, 1 to 2 medium, 3 or more high. The score never uses outcomes
      or the hidden simulation risk tier.
    columns:
      - name: customer_id
        description: Customer key.
        data_tests: [unique, not_null]
      - name: created_at
        description: Account creation time (UTC).
      - name: country
        description: Customer country.
      - name: card_brand
        description: Default card brand.
      - name: card_funding
        description: Default card funding type.
      - name: is_returning
        description: Account existed before the experiment started.
        data_tests: [not_null]
      - name: account_age_days_at_exposure
        description: Whole days from account creation to first in-window checkout.
      - name: account_age_band
        description: new (signed up during the experiment), 0-90d, 90-365d, or 365d+.
        data_tests:
          - accepted_values:
              arguments:
                values: [new, 0-90d, 90-365d, 365d+]
      - name: risk_score
        description: Sum of risk points (0 to 5).
      - name: risk_score_band
        description: low, medium, or high, from risk_score.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, medium, high]

  - name: dim_experiment
    description: >
      One row per customer assigned to the experiment. The analysis population is customers with
      is_exposed = true (at least one in-window session); SRM checks and all estimates use only them.
    columns:
      - name: experiment_id
        description: Experiment key (var experiment_id).
        data_tests: [not_null]
      - name: customer_id
        description: Assigned customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: variant
        description: control (CVC shown) or treatment (CVC removed).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [control, treatment]
      - name: assigned_at
        description: Bucketing time from the assignment log.
        data_tests: [not_null]
      - name: first_exposure_at
        description: First in-window checkout session; null if never exposed.
      - name: is_exposed
        description: Customer had at least one in-window checkout session.
        data_tests: [not_null]
      - name: experiment_sessions
        description: Number of in-window sessions.
      - name: pre_period_sessions
        description: Number of pre-period sessions (CUPED covariate denominator).
      - name: pre_period_successful_sessions
        description: Number of pre-period successful sessions (CUPED covariate numerator).

  - name: fct_checkout_sessions
    description: >
      One row per checkout session, pre-period and experiment window, with funnel flags, variant,
      and customer segments. Grain matches stg_checkout_sessions exactly.
    columns:
      - name: checkout_session_id
        description: Session key.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Customer key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: charge_id
        description: Charge for this session, if any.
      - name: created_at
        description: Session creation time (UTC); the semantic layer's metric_time.
        data_tests: [not_null]
      - name: session_date
        description: UTC date of the session.
      - name: period
        description: pre_period or experiment.
        data_tests:
          - accepted_values:
              arguments:
                values: [pre_period, experiment]
      - name: experiment_week
        description: 1-based experiment week, null outside the window.
      - name: experiment_id
        description: Experiment key.
      - name: variant
        description: Customer's variant. Pre-period rows carry it too, for A/A checks.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [control, treatment]
      - name: is_exposed
        description: Customer belongs to the exposed analysis population.
      - name: country
        description: Customer country.
      - name: card_brand
        description: Customer default card brand.
      - name: card_funding
        description: Customer default card funding type.
      - name: is_returning
        description: Customer account existed before the experiment.
      - name: account_age_band
        description: Account age band at first exposure.
      - name: risk_score_band
        description: Observable risk band from dim_customers.
      - name: is_attempted
        description: Customer submitted payment.
        data_tests: [not_null]
      - name: is_authorized
        description: Payment was authorized.
        data_tests: [not_null]
      - name: is_succeeded
        description: Payment was captured (the conversion event).
        data_tests: [not_null]
      - name: currency
        description: Session currency.
      - name: amount_total_usd
        description: Cart total in USD.
      - name: succeeded_amount_usd
        description: Captured amount in USD, 0 unless succeeded.

  - name: fct_charges
    description: >
      One row per charge (payment attempt) with authorization outcome, USD amounts, segments, and
      dispute maturity at the final (analysis_date) and early (experiment end) vantage points.
      Grain matches stg_charges exactly.
    columns:
      - name: charge_id
        description: Charge key.
        data_tests: [unique, not_null]
      - name: checkout_session_id
        description: Session the charge paid for.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_checkout_sessions')
                field: checkout_session_id
      - name: customer_id
        description: Customer key.
        data_tests: [not_null]
      - name: created_at
        description: Charge creation time (UTC); the semantic layer's metric_time.
        data_tests: [not_null]
      - name: charge_date
        description: UTC date of the charge.
      - name: period
        description: Period of the parent session (pre_period or experiment).
      - name: experiment_week
        description: Experiment week of the parent session.
      - name: experiment_id
        description: Experiment key.
      - name: variant
        description: Customer's variant.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [control, treatment]
      - name: is_exposed
        description: Customer belongs to the exposed analysis population.
      - name: country
        description: Customer country.
      - name: card_brand
        description: Card brand used for the charge.
      - name: card_funding
        description: Card funding type used for the charge.
      - name: card_country
        description: Card issuing country.
      - name: is_returning
        description: Customer account existed before the experiment.
      - name: account_age_band
        description: Account age band at first exposure.
      - name: risk_score_band
        description: Observable risk band from dim_customers.
      - name: status
        description: succeeded or failed.
        data_tests:
          - accepted_values:
              arguments:
                values: [succeeded, failed]
      - name: is_authorized
        description: Issuer authorized the charge.
        data_tests: [not_null]
      - name: is_captured
        description: Authorization was captured (a successful payment).
        data_tests: [not_null]
      - name: outcome_type
        description: Stripe outcome.type.
      - name: outcome_reason
        description: Stripe outcome.reason.
      - name: outcome_network_status
        description: Stripe outcome.network_status.
      - name: outcome_risk_level
        description: Radar risk level.
      - name: failure_code
        description: Stripe failure_code.
      - name: cvc_check
        description: CVC check result, null when no CVC was sent.
      - name: currency
        description: Charge currency.
      - name: amount_usd
        description: Attempted amount in USD.
      - name: captured_amount_usd
        description: Captured amount in USD (0 unless captured). Sum over captured charges is payment volume.
      - name: dispute_id
        description: Dispute on this charge, if any was ever opened.
      - name: dispute_created_at
        description: When the dispute was opened.
      - name: dispute_reason
        description: Stripe dispute reason.
      - name: dispute_status
        description: Dispute status as of the snapshot.
      - name: dispute_lag_days
        description: Days from charge to dispute.
      - name: is_disputed
        description: Disputed on or before analysis_date.
        data_tests: [not_null]
      - name: is_matured
        description: Dispute window fully elapsed by analysis_date. Dispute rate uses matured captured charges only.
        data_tests: [not_null]
      - name: is_disputed_at_experiment_end
        description: Disputed before the experiment ended (early read).
      - name: is_matured_at_experiment_end
        description: Dispute window elapsed by experiment end (early read).
      - name: disputed_amount_usd
        description: Disputed amount in USD if disputed by analysis_date, else 0.
