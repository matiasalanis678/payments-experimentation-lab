# Project settings. Everything here is knowledge a real analyst would have:
# experiment design, dates, scale, and the master random seed.
# The data-generating process and planted effects live in config/truth.yaml.

seed: 20260601

experiment:
  id: exp_remove_cvc
  name: Remove CVC field from checkout
  start_date: 2026-06-01        # a Monday
  weeks: 8
  # Salt for customer-level hash bucketing. v1 failed the pre-experiment A/A check
  # (pre-period conversion z = -4.18 clustered; observables balanced, no code leak), so the
  # assignment was re-salted with a rule fixed in advance: first of v2, v3, ... with
  # |z| < 2 and every observable covariate chi-square p > 0.05. See analysis/preperiod.py.
  hash_salt: exp_remove_cvc_v2
  treatment_share: 0.5
  # control = CVC field shown, treatment = CVC field removed

analysis:
  dispute_maturity_days: 60      # a charge is "matured" once this many days have passed
  analysis_date: 2026-09-25      # experiment end (2026-07-27) + 60 days
  pre_period_weeks: 4            # pre-experiment window kept for CUPED
  # Blindness gate: in-window treatment vs control queries refuse to run until this is true.
  # Flipped only after the "pre-registration" commit (Phase 5).
  unblinded: true

simulation:
  n_customers: 200000

paths:
  raw_dir: data/raw
  truth_dir: data/truth          # hidden labels; never loaded into the warehouse
  warehouse: data/warehouse.duckdb
